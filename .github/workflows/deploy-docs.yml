name: Deploy documentation portal

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/sync-releases.mjs'
      - 'scripts/verify-manifest-sync.mjs'
      - 'scripts/verify-site.mjs'
      - '.github/workflows/deploy-docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync real release metadata
        run: node scripts/sync-releases.mjs

      - name: Manifest sync & drift prevention
        run: node scripts/verify-manifest-sync.mjs

      - name: Pre-deploy audit
        run: node scripts/verify-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
