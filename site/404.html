<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Axym</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <link rel="canonical" href="https://www.irshadpc.in/axym-release/">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--canvas:#080F15;--surface:#101E27;--text:#EDF8FA;--secondary:#A0B7C2;--muted:#849CA9;--border:#253641;--brand:#5DE4DF;--on-brand:#080F15}
    @media (prefers-color-scheme:light){:root{color-scheme:light;--canvas:#F5F8FA;--surface:#FFFFFF;--text:#10232D;--secondary:#48616E;--muted:#586F7C;--border:#D4E0E6;--brand:#006E73;--on-brand:#FFFFFF}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--canvas);color:var(--text);font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
    main{max-width:520px;width:100%;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:40px}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;font-size:19px;font-weight:650;letter-spacing:-.04em}
    .mark{width:30px;height:30px;border-radius:7px;background:var(--brand);display:grid;place-items:center}
    .mark svg{width:20px;height:20px}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--brand);letter-spacing:.08em;margin-bottom:10px}
    h1{font-size:32px;letter-spacing:-.04em;line-height:1.15;margin:0 0 12px}
    p{margin:0 0 24px;color:var(--secondary);font-size:15px}
    a{color:var(--brand);text-underline-offset:.18em}
    .btn{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:8px;background:var(--brand);color:var(--on-brand);font-weight:600;text-decoration:none}
    :focus-visible{outline:2px solid var(--brand);outline-offset:3px}
  </style>
  <script>
    (function () {
      var mode = 'system';
      try { var saved = localStorage.getItem('axym-theme'); if (saved === 'light' || saved === 'dark' || saved === 'system') mode = saved; } catch (e) {}
      var resolved = mode;
      if (mode === 'system') resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = resolved;
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
</head>
<body>
  <main>
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M17 20.5h30L17 43.5h30" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      axym
    </div>
    <p class="code">404 · NOT FOUND</p>
    <h1>This address is not part of the Axym portal.</h1>
    <p>The page may have moved, or the hash route may be mistyped. Return to the product overview or open the documentation.</p>
    <a class="btn" href="/axym-release/#home">Go to Axym</a>
    <p style="margin:20px 0 0;font-size:13px">Or read the <a href="/axym-release/#quickstart">Quick Start</a>.</p>
  </main>
  <script>
    /* Keep the URL on the portal base while preserving the hash router. */
    (function () {
      var base = location.pathname.indexOf('/axym-release/') === 0 ? '/axym-release/' : '/';
      if (location.pathname !== base && location.pathname !== base.slice(0, -1)) {
        location.replace(base + '#home');
      }
    })();
  </script>
</body>
</html>
